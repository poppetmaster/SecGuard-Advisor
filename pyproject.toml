[project]
name = "secguard-advisor"
version = "0.1.0"
description = "Agente consultor defensivo de ciberseguridad empresarial y seguridad de aplicaciones de IA"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.14.17",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
secguard-advisor = "secguard_advisor:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents", ".opencode", ".specify", ".venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: pruebas que requieren Ollama, embeddings y recuperación reales",
]

[tool.coverage.run]
source = ["src"]
branch = true
