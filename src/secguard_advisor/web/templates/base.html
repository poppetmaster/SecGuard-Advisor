<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SecGuard Advisor{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a class="text-lg font-semibold" href="/">SecGuard Advisor</a>
        <span class="text-sm text-slate-500">Consulta documental con evidencia</span>
      </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/flowbite.min.js" defer></script>
    <script src="/static/js/forms.js" defer></script>
  </body>
</html>
