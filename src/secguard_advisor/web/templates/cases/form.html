<form
  id="case-form"
  method="post"
  action="/cases"
  hx-post="/cases"
  hx-target="#case-form"
  hx-swap="outerHTML"
  class="space-y-5 rounded-lg border border-slate-200 bg-white p-6 shadow-sm"
>
  <div>
    <label class="block text-sm font-medium text-slate-800" for="title">Título *</label>
    <input
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      id="title"
      name="title"
      type="text"
      maxlength="200"
      required
      value="{{ values.get('title', '') }}"
    >
    {% if errors.get('title') %}
    <p class="mt-1 text-sm text-red-700">{{ errors.get('title') }}</p>
    {% endif %}
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="description">Descripción</label>
    <textarea
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      id="description"
      name="description"
      rows="3"
    >{{ values.get('description', '') }}</textarea>
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="ai_application">Aplicación de IA analizada</label>
    <textarea
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      id="ai_application"
      name="ai_application"
      rows="2"
    >{{ values.get('ai_application', '') }}</textarea>
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="data_processed">Datos tratados</label>
    <textarea
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      id="data_processed"
      name="data_processed"
      rows="2"
    >{{ values.get('data_processed', '') }}</textarea>
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="assets">Activos relevantes</label>
    <textarea
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      id="assets"
      name="assets"
      rows="3"
      placeholder="api-gateway&#10;portal-clientes"
    >{{ values.get('assets', '') }}</textarea>
    <p class="mt-1 text-xs text-slate-500">Uno por línea. Los activos vacíos no se registran.</p>
    {% if errors.get('assets') %}
    <p class="mt-1 text-sm text-red-700">{{ errors.get('assets') }}</p>
    {% endif %}
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-800" for="restrictions">Restricciones conocidas</label>
    <textarea
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      id="restrictions"
      name="restrictions"
      rows="2"
    >{{ values.get('restrictions', '') }}</textarea>
  </div>

  <div class="flex items-center gap-3">
    <button class="inline-flex items-center rounded-lg bg-blue-700 px-4 py-2 text-sm font-medium text-white hover:bg-blue-800" type="submit">
      Crear caso
    </button>
    <a class="text-sm text-slate-600 hover:underline" href="/cases">Cancelar</a>
  </div>
</form>
