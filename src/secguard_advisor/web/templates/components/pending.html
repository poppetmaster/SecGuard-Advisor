{% macro pending(message) %}
<div class="mt-2 min-h-6" data-pending-indicator>
  <p class="flex items-center gap-2 text-sm font-medium text-slate-700" role="status" aria-live="polite">
    <svg
      class="h-4 w-4 shrink-0 animate-spin text-blue-700 motion-reduce:animate-none"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
      focusable="false"
      data-pending-spinner
      hidden
    >
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"></path>
    </svg>
    <span data-pending-text hidden>{{ message }}</span>
  </p>
  <p class="text-sm font-medium text-red-700" data-form-error role="alert" hidden></p>
</div>
{% endmacro %}
