name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sincronizar entorno
        run: uv sync --locked

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar recursos de interfaz
        run: npm ci

      - name: Construir recursos
        run: npm run build

      - name: Verificar recursos reproducibles
        run: git diff --exit-code -- src/secguard_advisor/web/static

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Verificación completa
        run: make check
