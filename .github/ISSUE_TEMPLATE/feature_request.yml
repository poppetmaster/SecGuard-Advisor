name: "Solicitud de funcionalidad"
description: "Propón una nueva funcionalidad o una mejora concreta del sistema."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe el problema antes que la solución. Revisa `CONSTITUTION.md` para alinear la
        propuesta con la arquitectura y el alcance del proyecto.

  - type: textarea
    id: problema
    attributes:
      label: "Problema o necesidad"
      description: "¿Qué necesidad resuelve? ¿A quién afecta?"
      placeholder: "Como ... necesito ... para ..."
    validations:
      required: true

  - type: textarea
    id: solucion
    attributes:
      label: "Solución propuesta"
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: "Alternativas consideradas"
    validations:
      required: false

  - type: textarea
    id: criterios
    attributes:
      label: "Criterios de aceptación"
      description: "Condiciones verificables que debe cumplir la funcionalidad."
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: input
    id: trazabilidad
    attributes:
      label: "Trazabilidad"
      description: "Issue o tarjeta relacionada (si aplica)."
    validations:
      required: false

  - type: checkboxes
    id: confirmaciones
    attributes:
      label: "Confirmaciones"
      options:
        - label: "Busqué propuestas existentes y no encontré un duplicado."
          required: true
        - label: "La propuesta está alineada con el alcance del proyecto."
          required: true
